services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile-Nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./
      dockerfile: Dockerfile-Php8-Fpm
    container_name: fzl-php8.3-fpm
    volumes:
      - ./:/var/www/html